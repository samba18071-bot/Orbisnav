name: orbisnav
description: AI-Eyes / OrbisNav Spatial Perception & Navigation HUD.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  camera: ^0.12.1
  sensors_plus: ^7.1.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  web_socket_channel: ^3.0.1
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  webview_flutter: ^4.14.1
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

